name: CI

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      search_backend:
        description: "Search backend for the eval (live = PubMed / Europe PMC; fixture = synthetic library)"
        type: choice
        options: [live, fixture]
        default: live
      tags:
        description: "Golden-set tags to evaluate (comma-separated, or all = the 47 items, ~$5-10)"
        default: ci
      budget:
        description: "Per-run budget cap (USD)"
        default: "0.50"

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Offline tests + offline eval gate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: evidence_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/evidence_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - name: Install backend
        run: pip install -e "backend[dev]"
      - name: Offline test suite (FakeLLM + fixtures; Postgres store tests against the service)
        working-directory: backend
        run: python -m pytest -q
      - name: Offline eval gate (FakeLLM pipeline, heuristic judges, evals/thresholds.json "offline")
        run: python -m evals.run_eval --llm fake --no-cache --gate --out-dir eval-offline
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eval-offline
          path: eval-offline/

  eval:
    name: Eval gate (real models)
    needs: test
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      NCBI_API_KEY: ${{ secrets.NCBI_API_KEY }}
      SEARCH_CONTACT_EMAIL: ${{ secrets.SEARCH_CONTACT_EMAIL }}
      SEARCH_BACKEND: ${{ inputs.search_backend || 'live' }}
      EVAL_TAGS: ${{ github.event_name == 'workflow_dispatch' && inputs.tags || 'ci' }}
      EVAL_BUDGET: ${{ inputs.budget || '0.50' }}
    steps:
      - name: Check for the API key
        id: key
        run: |
          if [ -z "$ANTHROPIC_API_KEY" ]; then
            echo "::notice::ANTHROPIC_API_KEY secret is not set; skipping the real-model eval."
            echo "present=false" >> "$GITHUB_OUTPUT"
          else
            echo "present=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.key.outputs.present == 'true'
      - uses: actions/setup-python@v5
        if: steps.key.outputs.present == 'true'
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - name: Install backend
        if: steps.key.outputs.present == 'true'
        run: pip install -e "backend[dev]"
      - name: Run the eval and apply the floors in evals/thresholds.json
        if: steps.key.outputs.present == 'true'
        run: |
          TAG_ARGS=""
          if [ "$EVAL_TAGS" != "all" ]; then TAG_ARGS="--tags $EVAL_TAGS"; fi
          python -m evals.run_eval $TAG_ARGS --budget "$EVAL_BUDGET" --search-backend "$SEARCH_BACKEND" \
            --concurrency 2 --max-total-usd 15 --out-dir eval-report --name ci --gate
      - name: Summary
        if: always() && steps.key.outputs.present == 'true'
        run: test -f eval-report/ci.md && cat eval-report/ci.md >> "$GITHUB_STEP_SUMMARY" || true
      - uses: actions/upload-artifact@v4
        if: always() && steps.key.outputs.present == 'true'
        with:
          name: eval-report
          path: eval-report/
